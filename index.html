<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặng Hoàng Linh</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header container">
  <a class="logo" href="#">Hồng Linh</a>
  <nav class="site-nav">
    <ul>
      <li><a href="#about">Giới thiệu</a></li>
      <li><a href="#projects">Dự án</a></li>
      <li><a href="#contact">Liên hệ</a></li>
    </ul>
  </nav>
</header>
<main class = container>
  <section id="about" class ="hero">
    <div>
    <h1>Đặng Hoàng Linh</h1>
    <p> Khoa Vật lý - Vật Lý Kĩ Thuật</p>
    <a class="button" href="#contact">Liên hệ</a>
    </div>
    <img class="profile-pic" src="me.jpg" alt=" Anh chan dung">
  </section>
<section id="projects">
  <h2>Dự án</h2>
  <div id="filters">
  </div>
 
  <ul id ="project-list">
  </ul>
    <template id="project-card">
      <li class="card">
        <h3></h3>
         <p class="tags"></p>
      </li>
    </template>
</section>
<section id="skills">
  <h2>Kỹ năng của tôi</h2>
  <ul class="tags">
    <li>HTML5</li>
    <li>CSS3</li>
    <li>JavaScript</li>
    <li>Fullstack</li>
    <li>Nhúng</li>
    <li>Phân tích dữ liệu</li>
    <li>Git & GitHub</li>
  </ul>
</section>
<section id="contact">
  <h2>Liên hệ</h2>
<form>
  <div class="field">
    <label for="name">Họ tên</label>
    <input id="name" name="name" required>
  </div>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email"
           name="email" required>
  </div>
  <div class="field">
    <label for="msg">Lời nhắn</label>
    <textarea id="msg" name="msg"></textarea>
  </div>
  <button class="button">Gửi</button>
</form>
</section>

</main>
<footer class ="container">© Dang Hoang Linh</footer>
<script type="module">
      import { projects } from './data.js';
      console.log("Danh sách dự án:", projects);
  </script>
<script type="module" src="app.js"></script>
</body>
</html>
